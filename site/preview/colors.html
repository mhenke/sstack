<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sstack colors</title>
    <link rel="stylesheet" href="../tokens.css" />
    <style>
      body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); }
      main { max-width: var(--container-max); margin: 0 auto; padding: var(--space-12) var(--space-6); }
      h1 { margin: 0 0 var(--space-6); font-family: var(--font-display); font-size: var(--text-2xl); line-height: var(--leading-tight); }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--space-4); }
      .swatch { border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); overflow: hidden; }
      .color { height: 88px; background: var(--value); }
      .meta { padding: var(--space-3); color: var(--muted); font-size: var(--text-sm); }
      strong { display: block; margin-bottom: var(--space-1); color: var(--fg); }
    </style>
  </head>
  <body>
    <main>
      <h1>Color roles</h1>
      <section class="grid">
        <article class="swatch" style="--value: var(--bg)"><div class="color"></div><div class="meta"><strong>Background</strong>--bg #1f1633</div></article>
        <article class="swatch" style="--value: var(--surface)"><div class="color"></div><div class="meta"><strong>Surface</strong>--surface #150f23</div></article>
        <article class="swatch" style="--value: var(--fg)"><div class="color"></div><div class="meta"><strong>Foreground</strong>--fg #ffffff</div></article>
        <article class="swatch" style="--value: var(--muted)"><div class="color"></div><div class="meta"><strong>Muted</strong>--muted #9d96b3</div></article>
        <article class="swatch" style="--value: var(--border)"><div class="color"></div><div class="meta"><strong>Border</strong>--border #362d59</div></article>
        <article class="swatch" style="--value: var(--border-strong)"><div class="color"></div><div class="meta"><strong>Border strong</strong>--border-strong #6f63b8</div></article>
        <article class="swatch" style="--value: var(--accent)"><div class="color"></div><div class="meta"><strong>Accent</strong>--accent #fa7faa</div></article>
        <article class="swatch" style="--value: var(--code)"><div class="color"></div><div class="meta"><strong>Code</strong>--code #dcdcaa</div></article>
        <article class="swatch" style="--value: var(--success)"><div class="color"></div><div class="meta"><strong>Success</strong>--success #4ade80</div></article>
        <article class="swatch" style="--value: var(--warn)"><div class="color"></div><div class="meta"><strong>Warning</strong>--warn #eab308</div></article>
        <article class="swatch" style="--value: var(--danger)"><div class="color"></div><div class="meta"><strong>Danger</strong>--danger #f87171</div></article>
      </section>
    </main>
  </body>
</html>
